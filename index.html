<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Davide Russo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e9; --ink:#14213d; --navy:#1f3a6b; --gold:#e0a526; --sky:#d5deec; --card:#ffffff; --muted:#5d6a82; --wire:#a3afc4;
  --display:"Lora",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
/* Layout: un'unica tela larga, letta da sinistra a destra: intro, Feed 1 e dati, catena dei passaggi, Feed 2 e dati. */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
.app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px}
.who .name{font-weight:700;font-size:15px}
.who .role{color:var(--muted);font-size:13px}
.cases{display:flex;gap:6px;flex-wrap:wrap}
.cases button{font:600 13px var(--body);border:1.5px solid var(--navy);background:transparent;color:var(--navy);padding:6px 14px;border-radius:999px;cursor:pointer}
.cases button[aria-pressed="true"]{background:var(--navy);color:#fff}
.plabel.pend{outline:2px dashed var(--gold);outline-offset:2px}
.lang{display:inline-flex;background:var(--sky);border-radius:999px;padding:3px}
.lang button{font:600 13px var(--body);border:0;background:transparent;color:var(--navy);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
button:focus-visible,.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vp{position:relative;flex:1;min-height:0}
.scroller{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;cursor:grab}
.scroller.drag{cursor:grabbing;user-select:none}
.canvas{position:relative;display:flex;align-items:center;gap:72px;width:max-content;min-height:100%;padding:120px 96px 120px 40px}
.col{display:flex;flex-direction:column;align-items:center;gap:44px}
.canvas>*{position:relative;z-index:1;flex:none}
svg.sv{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.base{z-index:0}svg.arcs{z-index:3}
.wire{fill:none;stroke:var(--wire);stroke-width:2;transition:stroke .15s}
.wire.lit{stroke:var(--gold);stroke-width:4}
.wire.arc{stroke:var(--gold);stroke-width:3.5;stroke-dasharray:8 7}
.wire.arc.ok{stroke-dasharray:none}
.dot{fill:var(--wire)}
.dot.g{fill:var(--gold)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,33,61,.25)}
.arrow.l{left:16px}.arrow.r{right:16px}
.arrow[hidden]{display:none}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.08;margin:12px 0 14px;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--navy)}
h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.18;margin:0 0 10px}
.intro{width:440px;cursor:default}
.lead{font-family:var(--display);font-size:18px;line-height:1.45;font-weight:600;margin:0 0 30px;padding:2px 0 2px 14px;border-left:4px solid var(--gold);max-width:640px;transition:opacity .15s}
.lead{white-space:pre-line}
.lead.pend{outline:none;border-left-style:dashed}
.path.open .lead{max-width:none;width:0;min-width:100%;box-sizing:border-box}
.canvas.has-sel .path.open .lead{opacity:.2}
.path{cursor:default}
.path:not(.open){width:470px;cursor:pointer;background:var(--card);border-style:solid;border-color:var(--wire);transition:box-shadow .15s}
.path:not(.open):hover{box-shadow:0 0 0 3px var(--gold)}
.path:not(.open) .lead{max-width:none;margin-bottom:18px}
.path:not(.open) .cols{display:none}
.path.open .pchips{display:none}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pchip{font-size:13px;font-weight:600;background:var(--sky);color:var(--navy);padding:6px 12px;border-radius:999px;transition:background .15s}
.pchip.lit{background:var(--gold);color:var(--ink);box-shadow:0 0 0 3px rgba(224,165,38,.3)}
.ptoggle{font:700 14px var(--body);color:#fff;background:var(--navy);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;margin-top:4px}
.path.open .ptoggle{margin-top:26px}
.period{border:2px dashed var(--wire);border-radius:32px;padding:0 26px 26px;margin-top:6px}
.plabel{display:inline-block;transform:translateY(-50%);background:var(--navy);color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:999px;margin-bottom:-4px}
.prow{display:flex;gap:72px;align-items:center}
.stepswrap{display:flex;flex-direction:column;align-items:flex-start}
.cols{display:flex;gap:72px;align-items:center}
.fnote{font-size:14px;font-weight:600;line-height:1.4;margin:12px 0 0}
.change{font-family:var(--display);font-size:18px;line-height:1.45;font-weight:600;margin:0 0 16px;padding:2px 0 2px 14px;border-left:4px solid var(--gold)}
.change.pend{outline:none;border-left-style:dashed}
.lede{font-size:16px;line-height:1.55;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.gold{background:var(--gold)}
a.chip{color:inherit;text-decoration:none;transition:box-shadow .15s}
a.chip:hover,a.chip:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.pend{outline:1.5px dashed var(--navy);outline-offset:3px;border-radius:6px}
.draft{background:var(--sky);border-radius:16px;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5}
.draft ul{margin:6px 0 0;padding-left:18px}
.go{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}

.node{background:var(--card);border-radius:24px;padding:20px 22px}
.stepcard{width:300px;padding:24px;transition:box-shadow .15s,opacity .15s}
.stepcard .num{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepcard p{font-size:15px;line-height:1.5;margin:0;white-space:pre-line}
.obst{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fbf1d6;border-left:4px solid var(--gold)}
.obst b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:12px;font-weight:600;background:var(--sky);color:var(--navy);padding:4px 10px;border-radius:999px}
.hypo{background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.hypo[hidden]{display:none}
.canvas.has-sel .stepcard:not(.lit){opacity:.45}
.stepcard.lit{box-shadow:0 0 0 4px var(--gold),0 14px 34px rgba(31,58,107,.16)}

.feedcard{width:300px;padding:18px}
.feedcard.after{background:var(--navy);color:#fff}
.when{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
.after .when{color:var(--gold)}
.feedcard h3{font-family:var(--display);font-size:22px;margin:12px 0 2px}
.feedcard .fs{font-size:14px;margin:0}
.grid{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#e4e0d6;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;position:relative}
.after .grid{background:#2d4c85}
.grid span{background:#d3cec1}
.after .grid span{background:#3b5c9a}
.grid .cap{position:absolute;inset:auto 0 0 0;background:rgba(243,240,233,.92);color:var(--ink);font-size:12px;font-weight:600;padding:8px 10px;text-align:center}
.grid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.metrics{display:flex;flex-direction:column;gap:16px;width:310px}
.metric{padding:16px 20px;min-height:118px;transition:box-shadow .15s,background .15s}
.metric .lab{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.metric .val{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.metric .note{font-size:12px;font-weight:600;color:var(--navy);margin-top:4px}
.metric.ph .val{font-family:var(--body);font-size:14px;font-weight:500;font-style:italic;color:var(--muted);line-height:1.4}
.metric.link{cursor:pointer}
.metric.link:hover,.metric.link.sel{background:#fbf3dc;box-shadow:0 0 0 3px var(--gold)}
.mnote{font-size:13px;line-height:1.45;margin-top:6px;padding:12px 16px;background:var(--sky);border-radius:18px;color:var(--ink)}
.mnote b{display:block;margin-bottom:3px;font-size:13px}
.mnote p{margin:0}
.mnote .mi{margin-bottom:4px}
.bands{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.band{display:flex;justify-content:space-between;padding:6px 12px;border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.band .bv{font-weight:700}
.band.on{background:var(--gold);color:var(--ink);font-weight:700}
.mnote .ml{font-weight:600}
.mnote .src{margin-top:4px;font-size:11px;color:var(--muted);font-weight:400}
.hint{font-size:13px;color:var(--muted);margin:0 0 4px;line-height:1.5}

.rail{flex:none;display:flex;padding:8px 16px 14px;overflow-x:auto;scrollbar-width:none}
.rn{position:relative;flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:0;font-family:var(--body);color:var(--ink)}
.rn::before{content:"";position:absolute;top:9px;left:0;right:0;height:2px;background:var(--wire)}
.rn:first-child::before{left:50%}.rn:last-child::before{right:50%}
.rn .d{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--wire);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,border-color .15s}
.rn .rl{font-size:11px;font-weight:600;color:var(--muted);max-width:92px;text-align:center;line-height:1.2}
.rn.cur .d{border-color:var(--navy);background:var(--navy);color:#fff}
.rn.cur .rl{color:var(--ink);font-weight:700}
.rn.lit .d{background:var(--gold);border-color:var(--gold);color:var(--ink);box-shadow:0 0 0 4px rgba(224,165,38,.3)}
.rn.lit .rl{color:var(--ink);font-weight:700}

@media (max-width:760px){
  .arrow{display:none}
  .bar{padding:10px 16px}
  .canvas{gap:52px;padding:110px 40px 32px 20px}
  .intro{width:min(320px,80vw)}
  h1{font-size:34px}
  .stepcard,.feedcard{width:260px}
  .metrics{width:250px}
  .rn{flex-basis:56px}
  .rn .rl{font-size:10px;max-width:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.scroller{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="who"><div class="name" id="who-name"></div><div class="role" id="who-role"></div></div>
    <div class="cases" id="cases" role="group" aria-label="Casi"></div>
    <div class="lang" role="group" aria-label="Lingua / Language">
      <button type="button" id="b-it" aria-pressed="true">IT</button>
      <button type="button" id="b-en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="vp">
    <button type="button" class="arrow l" id="prev" aria-label="Indietro" hidden>&#8592;</button>
    <div class="scroller" id="scroller"><main class="canvas" id="canvas" aria-label="Workflow"></main></div>
    <button type="button" class="arrow r" id="next" aria-label="Avanti">&#8594;</button>
  </div>
  <nav class="rail" id="rail" aria-label="Flusso"></nav>
</div>

    const ids = p.dataset.step.split(",");
    p.classList.toggle("lit", !!L && ids.every(i => i === "" || L.steps.indexOf(i) > -1));
  });
}
function bind(){
  document.querySelectorAll("[data-link]").forEach(n => {
    const key = n.dataset.link;
    n.addEventListener("mouseenter", () => { if (!sticky) select(key); });
    n.addEventListener("mouseleave", () => { if (!sticky) select(null); });
    n.addEventListener("focus", () => { if (!sticky) select(key); });
    n.addEventListener("blur", () => { if (!sticky) select(null); });
    n.addEventListener("click", e => { e.stopPropagation(); sticky = (sticky === key) ? null : key; select(sticky); });
    n.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } });
  });
}
document.addEventListener("click", () => { if (sticky) { sticky = null; select(null); } });

/* ---------- linee SVG ---------- */
function P(svg, d, cls, step){
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("class", "wire " + (cls || ""));
  if (step != null) p.dataset.step = step; svg.append(p); return p;
}
function D(svg, x, y, cls){ const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 4); c.setAttribute("class", "dot " + (cls || "")); svg.append(c); }
function R(el){
  const r = el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return { l: r.left - c.left, r: r.right - c.left, t: r.top - c.top, b: r.bottom - c.top, cx: (r.left + r.right) / 2 - c.left, cy: (r.top + r.bottom) / 2 - c.top };
}
function sizeSvg(svg){ svg.setAttribute("width", canvas.scrollWidth); svg.setAttribute("height", canvas.scrollHeight); }
function fan(svg, from, list){
  const f = R(from);
  list.forEach(n => { const m = R(n), mid = (f.r + m.l) / 2; P(svg, "M" + f.r + " " + f.cy + " C" + mid + " " + f.cy + " " + mid + " " + m.cy + " " + m.l + " " + m.cy); D(svg, m.l, m.cy); });
  D(svg, f.r, f.cy);
}
function link(svg, a, b, step){
  const A = R(a), B = R(b), mid = (A.r + B.l) / 2;
  P(svg, "M" + A.r + " " + A.cy + " C" + mid + " " + A.cy + " " + mid + " " + B.cy + " " + B.l + " " + B.cy, step != null ? "seq" : "", step); D(svg, B.l, B.cy);
}
function fanIn(svg, list, to){
  const f = R(to);
  list.forEach(n => { const m = R(n), mid = (m.r + f.l) / 2; P(svg, "M" + m.r + " " + m.cy + " C" + mid + " " + m.cy + " " + mid + " " + f.cy + " " + f.l + " " + f.cy); D(svg, m.r, m.cy); });
  D(svg, f.l, f.cy);
}
function vlink(svg, a, b, step){
  const A = R(a), B = R(b);
  P(svg, "M" + A.cx + " " + A.b + " V" + B.t, "seq", step); D(svg, B.cx, B.t);
}
function draw(){
  const svg = canvas.querySelector("svg.base"); svg.innerHTML = ""; sizeSvg(svg);
  fanIn(svg, bMetrics, feed1El);
  const chain = pathOpen ? [feed1El].concat(stepOrder.map(id => stepEls[id]), [feed2El]) : [feed1El, pathEl, feed2El];
  for (let i = 0; i < chain.length - 1 && pathOpen; i++) {
    const a = stepOrder[i - 1] || "", b = stepOrder[i] || "", ids = [a, b].filter(Boolean).join(",");
    if (a && b && chain[i].parentElement === chain[i + 1].parentElement) vlink(svg, chain[i], chain[i + 1], ids);
    else link(svg, chain[i], chain[i + 1], ids);
  }
  if (!pathOpen) { link(svg, feed1El, pathEl); link(svg, pathEl, feed2El); }
  fan(svg, feed2El, aMetrics);
  select(cur);
}
function drawArcs(L, key){
  const svg = canvas.querySelector("svg.arcs"); if (!svg) return;
  svg.innerHTML = ""; sizeSvg(svg);
  if (!L || !metricEls[key]) return;
  const m = R(metricEls[key]), H = canvas.scrollHeight;
  let kt = 0, kb = 0;
  L.steps.forEach(id => {
    const s = pathOpen ? stepEls[id] : chipEls[id]; if (!s) return;
    const S = R(s), p = s.parentElement;
    const low = pathOpen && p.children.length > 1 && p.lastElementChild === s;
    const cls = "arc" + (L.confirmed ? " ok" : "");
    if (low) { const y = H - 36 - (kb++) * 14; P(svg, "M" + m.cx + " " + m.b + " C" + m.cx + " " + y + " " + S.cx + " " + y + " " + S.cx + " " + S.b, cls); D(svg, S.cx, S.b, "g"); }
    else { const y = 36 + (kt++) * 14; P(svg, "M" + m.cx + " " + m.t + " C" + m.cx + " " + y + " " + S.cx + " " + y + " " + S.cx + " " + S.t, cls); D(svg, S.cx, S.t, "g"); }
  });
  D(svg, m.cx, m.t, "g");
}
window.addEventListener("resize", () => requestAnimationFrame(() => { draw(); updateNav(); }));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
$("b-it").addEventListener("click", () => { LANG = "it"; try { localStorage.setItem("pf-lang", "it"); } catch (e) {} render(); });
$("b-en").addEventListener("click", () => { LANG = "en"; try { localStorage.setItem("pf-lang", "en"); } catch (e) {} render(); });
render();
</script>
